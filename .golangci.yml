version: "2"

run:
  timeout: 5m

linters:
  # 默认组：errcheck / govet / staticcheck / unused / ineffassign
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
    - unparam
    - prealloc
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - copyloopvar
    - depguard
    - nolintlint
  settings:
    goimports:
      local-prefixes:
        - github.com/fab-viewer/common-lib
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: var-naming
        - name: receiver-naming
        - name: unexported-return
        - name: cognitive-complexity
          arguments: [15]
        - name: argument-limit
          arguments: [5]
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
    depguard:
      rules:
        # 跨层零依赖包：只允许标准库与 testify（测试用）。
        # 注意：depguard 的 deny/allow 是前缀匹配而非 glob，deny "github.com/**"
        # 永远不会命中——"禁一切三方"必须用 strict 模式的 allow 白名单表达。
        cross-layer-zero-deps:
          listMode: strict
          files:
            - "**/common/fverr/**"
            - "**/common/paging/**"
            - "**/common/actortx/**"
            - "**/common/rctx/**"
          allow:
            - "$gostd"
            - "github.com/stretchr/testify"
        # logx 完整日志工具：zap 引擎 + 自研编号滚动（2026-10-20 用户拍板：
        # 日志提供完整方案而非仅接口；滚动命名 log、log.1 ... log.N）。
        logx-zap-engine:
          listMode: strict
          files:
            - "**/common/logx/**"
          allow:
            - "$gostd"
            - "github.com/stretchr/testify"
            - "go.uber.org/zap"
        # i18n 跨层包：语言取自 tx 运行时上下文，除此之外零依赖。
        i18n-deps-only-tx:
          listMode: strict
          files:
            - "**/common/i18n/**"
          allow:
            - "$gostd"
            - "github.com/stretchr/testify"
            - "github.com/fab-viewer/common-lib/common/rctx"
        # api 包禁止依赖存储（deny 为前缀匹配，可命中全部子包）
        api-no-storage:
          files:
            - "**/api/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage"
              desc: "接口访问层组件禁止依赖存储包（层间隔离）"
        # 存储子包禁止依赖 api，且互不依赖
        storage-no-api:
          files:
            - "**/storage/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/api"
              desc: "存储层禁止依赖 API 包（层间隔离）"
        oracle-isolated:
          files:
            - "**/storage/oracle/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage/clickhouse"
              desc: "存储子包互相隔离"
            - pkg: "github.com/fab-viewer/common-lib/storage/opensearch"
              desc: "存储子包互相隔离"
        clickhouse-isolated:
          files:
            - "**/storage/clickhouse/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage/oracle"
              desc: "存储子包互相隔离"
            - pkg: "github.com/fab-viewer/common-lib/storage/opensearch"
              desc: "存储子包互相隔离"
        opensearch-isolated:
          files:
            - "**/storage/opensearch/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage/oracle"
              desc: "存储子包互相隔离"
            - pkg: "github.com/fab-viewer/common-lib/storage/clickhouse"
              desc: "存储子包互相隔离"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # 外部测试包（xxx_test）需要 import 被测包自身，depguard strict
      # 白名单无法表达自引用，测试文件豁免。
      - path: common/(i18n|logx)/.+_test\.go
        linters:
          - depguard
      - path: examples/
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fab-viewer/common-lib
