version: "2"

run:
  timeout: 5m

linters:
  # 默认组：errcheck / govet / staticcheck / unused / ineffassign
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
    - unparam
    - prealloc
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - copyloopvar
    - depguard
    - nolintlint
  settings:
    goimports:
      local-prefixes:
        - github.com/fab-viewer/common-lib
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: var-naming
        - name: receiver-naming
        - name: unexported-return
        - name: cognitive-complexity
          arguments: [15]
        - name: argument-limit
          arguments: [5]
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
    depguard:
      rules:
        # 跨层零依赖包：只允许标准库与 testify（测试用）。
        # 注意：depguard 的 deny/allow 是前缀匹配而非 glob，deny "github.com/**"
        # 永远不会命中——"禁一切三方"必须用 strict 模式的 allow 白名单表达。
        cross-layer-zero-deps:
          listMode: strict
          files:
            - "**/common/errs/**"
            - "**/common/paging/**"
            - "**/common/logx/**"
            - "**/common/actor/**"
            - "**/common/tx/**"
          allow:
            - "$gostd"
            - "github.com/stretchr/testify"
        # api 包禁止依赖存储（deny 为前缀匹配，可命中全部子包）
        api-no-storage:
          files:
            - "**/api/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage"
              desc: "接口访问层组件禁止依赖存储包（层间隔离）"
        # 存储子包禁止依赖 api，且互不依赖
        storage-no-api:
          files:
            - "**/storage/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/api"
              desc: "存储层禁止依赖 API 包（层间隔离）"
        oracle-isolated:
          files:
            - "**/storage/oracle/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage/clickhouse"
              desc: "存储子包互相隔离"
            - pkg: "github.com/fab-viewer/common-lib/storage/opensearch"
              desc: "存储子包互相隔离"
        clickhouse-isolated:
          files:
            - "**/storage/clickhouse/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage/oracle"
              desc: "存储子包互相隔离"
            - pkg: "github.com/fab-viewer/common-lib/storage/opensearch"
              desc: "存储子包互相隔离"
        opensearch-isolated:
          files:
            - "**/storage/opensearch/**"
          deny:
            - pkg: "github.com/fab-viewer/common-lib/storage/oracle"
              desc: "存储子包互相隔离"
            - pkg: "github.com/fab-viewer/common-lib/storage/clickhouse"
              desc: "存储子包互相隔离"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: examples/
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fab-viewer/common-lib
